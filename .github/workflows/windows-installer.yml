name: Windows Installer

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build Windows application
        run: python -m PyInstaller installer/invisible3d.spec --noconfirm --clean

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: cmd
        run: |
          "%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" installer\invisible3d.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: INVISIBLE3D-Windows-Installer
          path: installer/dist-installer/INVISIBLE3D-Setup.exe
          if-no-files-found: error

      - name: Upload installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/dist-installer/INVISIBLE3D-Setup.exe
          generate_release_notes: true
